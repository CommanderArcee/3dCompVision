[project]
name = "cv-final-project"
version = "0.1.0"
description = "Multi-technique 3D reconstruction and CV analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.4",
  "opencv-contrib-python>=4.10.0.84",
  "matplotlib>=3.8.4",
  "scipy>=1.13.1",
  "scikit-learn>=1.5.1",
  "imageio>=2.34.2",
  "pillow>=10.4.0",
  "requests>=2.32.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvfinal"]
